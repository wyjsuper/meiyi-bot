<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美易在线答疑 - 美纳里尼合规报销智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 配置面板样式 */
        .config-btn {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--primary-color);
            transition: var(--transition);
            z-index: 1000;
        }

        .config-btn:hover {
            transform: rotate(90deg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .config-panel, .upload-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 1001;
            min-width: 400px;
            max-width: 500px;
        }

        .config-panel-header, .upload-panel-header {
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .config-panel-body, .upload-panel-body {
            padding: 20px;
        }

        .action-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .action-buttons .btn {
            border-radius: 25px;
            padding: 10px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: var(--transition);
        }

        .action-buttons .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <!-- 状态指示器 -->
    <div class="status-badge offline" id="statusBadge">
        <span class="status-dot"></span>
        <span>检测中...</span>
    </div>

    <!-- 主容器 -->
    <div class="chat-container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-icon">
                <i class="fas fa-robot"></i>
            </div>
            <div class="header-content">
                <h1>美易在线答疑</h1>
                <p>美纳里尼合规报销智能助手</p>
            </div>
        </header>

        <!-- 消息区域 -->
        <div class="messages-container">
            <div class="messages" id="messages">
                <!-- 初始欢迎消息 -->
                <div class="message assistant">
                    <div class="message-header">
                        <span>🤖 合规助手</span>
                        <span id="welcomeTime"></span>
                    </div>
                    <div class="message-content">
                        <strong>欢迎使用美纳里尼合规报销智能助手！</strong><br><br>
                        我可以帮您解答合规和报销相关问题。请输入您的问题，比如：
                        <br>• 为什么重置密码的邮件一直收不到？
                        <br>• 报销流程是什么？
                        <br>• 如何登录系统？
                        <br><br>
                        <div class="quick-questions">
                            <button class="quick-question">为什么重置密码的邮件一直收不到?</button>
                            <button class="quick-question">报销流程是什么?</button>
                            <button class="quick-question">如何登录系统?</button>
                            <button class="quick-question">发票要求有哪些?</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="input-container">
            <form id="chatForm" class="input-group">
                <input type="text" class="form-control" id="userInput"
                       placeholder="请输入您的问题..." required>
                <button type="submit" class="btn btn-primary" id="sendBtn">
                    <i class="fas fa-paper-plane me-2"></i>发送
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
        // 设置欢迎消息的时间
        document.getElementById('welcomeTime').textContent = new Date().toLocaleTimeString();
    </script>
</body>
</html>
