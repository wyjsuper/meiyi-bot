<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美易在线答疑 - 美纳里尼合规报销智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- 状态指示器 -->
    <div class="status-badge offline" id="statusBadge">
        <span class="status-dot"></span>
        <span>检测中...</span>
    </div>

    <!-- 配置按钮 -->
    <div class="config-btn" id="configBtn">
        <i class="fas fa-cog"></i>
    </div>

    <!-- 主容器 -->
    <div class="chat-container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-icon">
                <i class="fas fa-robot"></i>
            </div>
            <div class="header-content">
                <h1>美易在线答疑</h1>
                <p>美纳里尼合规报销智能助手</p>
            </div>
        </header>

        <!-- 消息区域 -->
        <div class="messages-container">
            <div class="messages" id="messages">
                <!-- 初始欢迎消息 -->
                <div class="message assistant">
                    <div class="message-header">
                        <span>🤖 合规助手</span>
                        <span id="welcomeTime"></span>
                    </div>
                    <div class="message-content">
                        <strong>欢迎使用美纳里尼合规报销智能助手！</strong><br><br>
                        我可以帮您解答合规和报销相关问题。请输入您的问题，比如：
                        <br>• 为什么重置密码的邮件一直收不到？
                        <br>• 报销流程是什么？
                        <br>• 如何登录系统？
                        <br><br>
                        <div class="quick-questions">
                            <button class="quick-question">为什么重置密码的邮件一直收不到?</button>
                            <button class="quick-question">报销流程是什么?</button>
                            <button class="quick-question">如何登录系统?</button>
                            <button class="quick-question">发票要求有哪些?</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="input-container">
            <form id="chatForm" class="input-group">
                <input type="text" class="form-control" id="userInput"
                       placeholder="请输入您的问题..." required>
                <button type="submit" class="btn btn-primary" id="sendBtn">
                    <i class="fas fa-paper-plane me-2"></i>发送
                </button>
            </form>
        </div>
    </div>

    <!-- 配置面板 -->
    <div class="config-panel" id="configPanel" style="display: none;">
        <div class="config-panel-content">
            <div class="config-panel-header">
                <h5>系统配置</h5>
                <button type="button" class="btn-close" onclick="toggleConfigPanel()"></button>
            </div>
            <div class="config-panel-body">
                <div class="mb-3">
                    <label for="maxAnswers" class="form-label">最大显示答案数</label>
                    <input type="number" class="form-control" id="maxAnswers" min="1" max="10" value="2">
                    <small class="text-muted">显示多少个相关答案</small>
                </div>
                <div class="mb-3">
                    <label for="similarityThreshold" class="form-label">相似度阈值</label>
                    <input type="range" class="form-range" id="similarityThreshold" min="0" max="100" value="40">
                    <div class="d-flex justify-content-between">
                        <small>0%</small>
                        <small id="similarityValue">40%</small>
                        <small>100%</small>
                    </div>
                    <small class="text-muted">低于此值的答案将显示为相关参考</small>
                </div>
                <button class="btn btn-primary w-100" onclick="saveConfig()">
                    <i class="fas fa-save me-2"></i>保存配置
                </button>
            </div>
        </div>
    </div>

    <!-- 知识库上传面板 -->
    <div class="upload-panel" id="uploadPanel" style="display: none;">
        <div class="upload-panel-content">
            <div class="upload-panel-header">
                <h5>知识库管理</h5>
                <button type="button" class="btn-close" onclick="toggleUploadPanel()"></button>
            </div>
            <div class="upload-panel-body">
                <div class="mb-3">
                    <label for="knowledgeFile" class="form-label">上传知识库文件 (.docx)</label>
                    <input type="file" class="form-control" id="knowledgeFile" accept=".docx">
                    <small class="text-muted">支持Word文档格式，问答格式应为：问题-答案</small>
                </div>
                <div class="alert alert-info" id="uploadStatus" style="display: none;"></div>
                <button class="btn btn-success w-100" onclick="uploadKnowledge()">
                    <i class="fas fa-upload me-2"></i>上传知识库
                </button>
            </div>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="action-buttons">
        <button class="btn btn-secondary" id="configToggle" onclick="toggleConfigPanel()">
            <i class="fas fa-cog me-2"></i>配置
        </button>
        <button class="btn btn-info" id="uploadToggle" onclick="toggleUploadPanel()">
            <i class="fas fa-upload me-2"></i>知识库
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/app.js"></script>
    <script>
        // 设置欢迎消息的时间
        document.getElementById('welcomeTime').textContent = new Date().toLocaleTimeString();

        // 相似度滑块更新
        document.getElementById('similarityThreshold').addEventListener('input', function() {
            document.getElementById('similarityValue').textContent = this.value + '%';
        });

        // 切换配置面板
        function toggleConfigPanel() {
            const panel = document.getElementById('configPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        // 切换上传面板
        function toggleUploadPanel() {
            const panel = document.getElementById('uploadPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        // 保存配置
        async function saveConfig() {
            try {
                const maxAnswers = document.getElementById('maxAnswers').value;
                const similarityThreshold = document.getElementById('similarityThreshold').value / 100;

                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        max_answers: parseInt(maxAnswers),
                        similarity_threshold: similarityThreshold
                    })
                });

                const data = await response.json();
                if (data.success) {
                    alert('配置保存成功！');
                    toggleConfigPanel();
                } else {
                    alert('配置保存失败：' + data.error);
                }
            } catch (error) {
                alert('配置保存失败：' + error.message);
            }
        }

        // 上传知识库
        async function uploadKnowledge() {
            const fileInput = document.getElementById('knowledgeFile');
            const file = fileInput.files[0];

            if (!file) {
                alert('请选择要上传的文件');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.style.display = 'block';
            statusDiv.className = 'alert alert-info';
            statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>正在上传...';

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.className = 'alert alert-success';
                    statusDiv.innerHTML = `<i class="fas fa-check-circle me-2"></i>${data.message} 共 ${data.qa_pairs_count} 个问答对`;
                    // 重置文件输入
                    fileInput.value = '';
                } else {
                    statusDiv.className = 'alert alert-danger';
                    statusDiv.innerHTML = `<i class="fas fa-exclamation-circle me-2"></i>${data.error}`;
                }
            } catch (error) {
                statusDiv.className = 'alert alert-danger';
                statusDiv.innerHTML = `<i class="fas fa-exclamation-circle me-2"></i>上传失败：${error.message}`;
            }
        }
    </script>
</body>
</html>
